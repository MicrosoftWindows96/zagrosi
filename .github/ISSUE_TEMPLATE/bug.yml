name: Bug report
description: Report a defect in Zagrosi.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the fields below.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered list. Include the exact commands or UI actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Operating system, Zagrosi version, browser (if web), Rust toolchain version (if relevant).
      placeholder: |
        OS: macOS 15.2
        Zagrosi: 0.1.0
        Browser: n/a
        Rust: 1.91.0
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Triage severity. See governance manual for severity-to-priority mapping.
      options:
        - critical
        - high
        - medium
        - low
      default: 2
    validations:
      required: true
