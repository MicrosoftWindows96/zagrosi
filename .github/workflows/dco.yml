name: dco

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: verify Signed-off-by trailer on every commit in range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$PUSH_BEFORE}"
          head="${PR_HEAD_SHA:-$PUSH_AFTER}"
          if [ -z "${base}" ] || [ -z "${head}" ]; then
            echo "::error::could not determine commit range; refusing to silently pass"
            exit 1
          fi
          fail=0
          for sha in $(git rev-list "${base}..${head}"); do
            if ! git log -1 --format=%B "${sha}" | grep -qE '^Signed-off-by: '; then
              echo "::error::commit ${sha} missing Signed-off-by trailer"
              fail=1
            fi
          done
          exit "${fail}"
