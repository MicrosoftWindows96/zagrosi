nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

apiGateway:
  enabled: false
  replicas: 1
worker:
  enabled: false
  replicas: 1
mcp:
  enabled: false
  replicas: 1
web:
  enabled: false
  replicas: 1

postgres:
  enabled: false
  # Self-hosted Postgres must run the Zagrosi custom image (pg_partman +
  # pg_parquet) or satisfy the "Managed Postgres requirements" section of
  # deploy/docker/postgres/README.md.
  # The image's BGW templating reads plain container env for any future
  # statefulset template: ZAGROSI_PARTMAN_DBNAME, ZAGROSI_PARTMAN_ROLE,
  # ZAGROSI_PARTMAN_INTERVAL.
  image:
    repository: ghcr.io/zagrosi-code/zagrosi-postgres
    tag: ""  # pin to deploy/docker/postgres/IMAGE_TAG value at deploy time
valkey:
  enabled: false

# Four-role Postgres DSNs (RLS split). Each entry names a Kubernetes
# Secret + key holding the full DSN for that role; future app/gateway/
# worker templates will surface them as ZAGROSI_DATABASE_URL (zagrosi_app),
# ZAGROSI_DATABASE_MIGRATE_URL, ZAGROSI_DATABASE_AUTH_URL, and
# ZAGROSI_DATABASE_MAINTENANCE_URL. Managed-Postgres users must bootstrap
# the four roles as their admin/superuser first — see "Managed Postgres
# requirements" in deploy/docker/postgres/README.md (BYPASSRLS cannot be
# granted by a non-superuser).
database:
  appDsnSecret:
    name: ""
    key: dsn
  migrateDsnSecret:
    name: ""
    key: dsn
  authDsnSecret:
    name: ""
    key: dsn
  maintenanceDsnSecret:
    name: ""
    key: dsn
nats:
  enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []

observability:
  otel:
    enabled: false
    endpoint: ""
  prometheus:
    enabled: false
    bind: ""
  logFormat: "json"
