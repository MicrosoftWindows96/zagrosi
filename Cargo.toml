[workspace]
resolver = "3"
members  = ["crates/zagrosi-core", "apps/api-gateway"]

[workspace.package]
edition      = "2024"
rust-version = "1.91"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/MicrosoftWindows96/zagrosi"
homepage     = "https://zagrosi.com"
authors      = ["Zagrosi Contributors"]
readme       = "README.md"

[workspace.dependencies]
# Core
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"

# Tracing + OpenTelemetry
tracing                        = "0.1"
tracing-subscriber             = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry          = "0.32"
opentelemetry                  = "0.31"
opentelemetry_sdk              = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp             = { version = "0.31", features = ["http-proto", "reqwest-client"] }
opentelemetry-appender-tracing = "0.31"

# Metrics
metrics                     = "0.24"
metrics-exporter-prometheus = "0.18"

# Config
figment = { version = "0.10", features = ["env", "toml"] }

# Async runtime, HTTP, utilities
tokio      = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum       = "0.8"
once_cell  = "1"

# Testing
proptest          = "1"
tempfile          = "3"
serial_test       = "3"
static_assertions = "1.1"

# Reserved for later sections (pinned now to prevent version skew)
sqlx            = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
async-nats      = "0.47"
tantivy         = "0.22"
rmcp            = "0.5"
extism          = "1"
argon2          = "0.5"
jsonwebtoken    = "10"
criterion       = "0.5"
axum-prometheus = "0.10"

[workspace.lints.rust]
unsafe_code      = "forbid"
missing_docs     = "warn"
unreachable_pub  = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Production safety
unwrap_used   = "deny"
expect_used   = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"
dbg_macro     = "deny"
print_stdout  = "deny"
print_stderr  = "deny"

# Quality groups (priority -1 lets individual overrides win)
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Allowed pedantic exceptions
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
debug         = false
panic         = "abort"

[profile.dev]
incremental = true
