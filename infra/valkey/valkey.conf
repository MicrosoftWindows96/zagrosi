# Valkey configuration for the Zagrosi dev stack.

bind 0.0.0.0 ::
protected-mode no
port 6379
tcp-keepalive 300
timeout 0

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 3600 1
save 300 100
save 60 10000
dir /data

maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

loglevel notice
logfile ""

slowlog-log-slower-than 10000
slowlog-max-len 128
