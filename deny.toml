# SPDX-License-Identifier: AGPL-3.0-or-later

[graph]
all-features = true

[advisories]
version = 2
yanked  = "deny"
ignore  = []

[licenses]
version              = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "AGPL-3.0-or-later",
]

[[licenses.exceptions]]
name  = "ring"
allow = ["MIT", "ISC", "OpenSSL"]

[[licenses.exceptions]]
name  = "unicode-ident"
allow = ["MIT", "Apache-2.0", "Unicode-DFS-2016"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[[bans.deny]]
name = "openssl"

[[bans.deny]]
name = "openssl-sys"

[[bans.deny]]
name = "native-tls"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
